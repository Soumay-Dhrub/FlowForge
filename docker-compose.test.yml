services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flowforge_test
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge_test"]
      interval: 5s
      timeout: 3s
      retries: 10
