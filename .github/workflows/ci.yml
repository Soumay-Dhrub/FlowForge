name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Boot 3.2.5's repackage goal cannot read class files from a JDK newer than 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Surefire excludes the "integration" group, so this needs no Docker.
      - name: Run backend unit and property tests
        working-directory: ./backend
        run: mvn verify

      # Excluded above, so they need their own step. All classes share one container.
      - name: Run backend integration tests
        working-directory: ./backend
        run: mvn verify -Pintegration -DfailIfNoTests=false

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Before setup-node: `cache: 'pnpm'` asks pnpm for its store path.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./frontend
        run: pnpm run lint

      - name: Run frontend tests
        working-directory: ./frontend
        run: pnpm run test:ci

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/coverage/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # SHA tag always, so a running container traces back to its commit.
      - name: Work out the image tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "backend=flowforge-backend:${{ github.sha }},flowforge-backend:latest" >> "$GITHUB_OUTPUT"
            echo "frontend=flowforge-frontend:${{ github.sha }},flowforge-frontend:latest" >> "$GITHUB_OUTPUT"
          else
            echo "backend=flowforge-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "frontend=flowforge-frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # scope: the gha backend defaults to "buildkit", so two images in one job would share a cache
      # key and contend over the same reservation.
      # ignore-error: the exporter intermittently fails on "failed to reserve cache"
      # (docker/build-push-action#1571) after the image has already built. Build failures still fail.
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ${{ steps.tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      # API_PROXY_TARGET stays at the Dockerfile default; it is build-time, not runtime.
      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ${{ steps.tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then
            echo "Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker build failed"
            exit 1
          fi
          echo "All CI checks passed!"
