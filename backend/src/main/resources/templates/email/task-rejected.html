<!DOCTYPE html>
<!--/*
  TASK_REJECTED (Requirements 17.2, 17.4). Sent to the request's initiator.

  The rejection comment is deliberately absent. Requirement 13.2 makes it mandatory so the decision is
  justified in the record; Requirement 17.4 asks for an email, not for the reasoning to be relayed
  through an uncontrolled channel. The reader follows the link and reads it in the application.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Your request was rejected</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7f9">
<div style="max-width:560px;margin:0 auto;padding:24px;background:#fff;border-radius:8px">
    <h1 style="margin:0 0 12px;font:600 18px/1.4 Helvetica,Arial,sans-serif">A step of your request was rejected</h1>

    <p style="margin:0 0 16px;font:14px/1.5 Helvetica,Arial,sans-serif">
        Hello <span th:text="${recipientName} ?: 'there'">there</span>, a reviewer rejected a step of
        your request. Open the request in FlowForge to read the reviewer's comment.
    </p>

    <div th:replace="~{email/fragments :: details}"></div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
