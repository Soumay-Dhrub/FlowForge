<!DOCTYPE html>
<!--/*
  TASK_ESCALATED (Requirements 11.3, 17.3, 17.4).

  One template for both parties. The escalation raises one notification for the previous assignee and
  one for the new one, and each is emailed separately, so the wording has to read correctly to either:
  the task moved because its deadline passed.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>A task was escalated</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7f9">
<div style="max-width:560px;margin:0 auto;padding:24px;background:#fff;border-radius:8px">
    <h1 style="margin:0 0 12px;font:600 18px/1.4 Helvetica,Arial,sans-serif">A task was escalated</h1>

    <p style="margin:0 0 16px;font:14px/1.5 Helvetica,Arial,sans-serif">
        Hello <span th:text="${recipientName} ?: 'there'">there</span>, a task passed its deadline and
        was reassigned. Open it in FlowForge to see who owns it now.
    </p>

    <div th:replace="~{email/fragments :: details}"></div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
