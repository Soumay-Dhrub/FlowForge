<!DOCTYPE html>
<!--/* TASK_ASSIGNED (Requirements 17.1, 17.4). */-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>A task is waiting for you</title>
</head>
<body style="margin:0;padding:24px;background:#f6f7f9">
<div style="max-width:560px;margin:0 auto;padding:24px;background:#fff;border-radius:8px">
    <h1 style="margin:0 0 12px;font:600 18px/1.4 Helvetica,Arial,sans-serif">A task is waiting for you</h1>

    <p style="margin:0 0 16px;font:14px/1.5 Helvetica,Arial,sans-serif">
        Hello <span th:text="${recipientName} ?: 'there'">there</span>, a workflow step has been
        assigned to you and is waiting for your action.
    </p>

    <div th:replace="~{email/fragments :: details}"></div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
