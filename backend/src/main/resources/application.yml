spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Off deliberately. Left on (the default) the session stays open through response
    # rendering, so a lazy association touched while serialising silently issues a query
    # outside any transaction — it works, invisibly costs an extra round trip per field,
    # and hides a missing fetch until some other caller reaches the same entity without a
    # session and gets LazyInitializationException. Services already map entities to DTOs
    # inside their @Transactional methods, which is where that work belongs.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # The container's own upload ceiling, and the first line of defence for Requirement 14.2: Tomcat
      # stops reading a part past this size, so a hostile 5 GB body never reaches application code.
      #
      # Deliberately set *above* app.attachment.max-size-bytes (10 MiB) rather than equal to it. A file
      # between the two limits reaches AttachmentService, which refuses it with the documented 413 and a
      # normal ApiResponse envelope naming the limit. Were the container limit the lower of the two, every
      # oversized upload would be cut off before any of that ran. Anything past the container limit is
      # still answered 413 — GlobalExceptionHandler maps MaxUploadSizeExceededException — but with a
      # generic message, because by then there is nothing left to inspect.
      max-file-size: ${ATTACHMENT_MAX_UPLOAD_SIZE:11MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:12MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    # access token: 15 minutes
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # refresh token: 7 days
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  password-reset:
    # reset token: 24 hours (Requirement 5.2 caps this; larger values are clamped to 24h)
    token-expiry-ms: ${PASSWORD_RESET_EXPIRY_MS:86400000}
    # base URL of the frontend page that collects the new password
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    from: ${MAIL_FROM:no-reply@flowforge.local}
  web:
    # Where notification emails point. They carry identifiers and this link, never request data or
    # comments, so the reader follows it back into the application where access control applies.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  attachment:
    # Per-file limit of Requirement 14.2. AttachmentStorage counts bytes while writing, so this holds
    # even when a request understates its Content-Length.
    max-size-bytes: ${ATTACHMENT_MAX_SIZE:10485760}
    allowed-types: application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    # Root directory for attachment bytes. Relative paths resolve against the process working
    # directory, which in the container image is /app — so the default lands on /app/var/attachments.
    # Deployments that need attachments to survive a container restart mount a volume there and set
    # ATTACHMENT_STORAGE_PATH to it. Only metadata goes in PostgreSQL; the bytes live here, and
    # attachments.storage_path stores a path *relative* to this root so the root can move.
    storage-path: ${ATTACHMENT_STORAGE_PATH:./var/attachments}

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint is exposed; everything else stays off by default.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # The container healthcheck drives depends_on: service_healthy, so it must reflect whether the
    # application can serve requests. An unreachable SMTP host does not stop it from serving:
    # mail delivery is a downstream concern, not a liveness signal.
    mail:
      enabled: false

server:
  port: 8080
