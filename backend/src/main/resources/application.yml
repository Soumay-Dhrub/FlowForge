spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    # access token: 15 minutes
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # refresh token: 7 days
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  password-reset:
    # reset token: 24 hours (Requirement 5.2 caps this; larger values are clamped to 24h)
    token-expiry-ms: ${PASSWORD_RESET_EXPIRY_MS:86400000}
    # base URL of the frontend page that collects the new password
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    from: ${MAIL_FROM:no-reply@flowforge.local}
  attachment:
    max-size-bytes: ${ATTACHMENT_MAX_SIZE:10485760}
    allowed-types: application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

server:
  port: 8080
