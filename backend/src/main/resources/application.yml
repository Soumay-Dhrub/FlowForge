spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Off deliberately: services map to DTOs inside their @Transactional methods.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Deliberately above app.attachment.max-size-bytes so an oversized file reaches
      # AttachmentService and gets a 413 naming the limit rather than a truncated stream.
      max-file-size: ${ATTACHMENT_MAX_UPLOAD_SIZE:11MB}
      max-request-size: ${ATTACHMENT_MAX_REQUEST_SIZE:12MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  bootstrap:
    admin:
      # First admin, created only while the users table is empty. See AdminBootstrap.
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@flowforge.local}
      # Empty on purpose: generated and logged at startup instead of shipping a known default.
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits}
    # access token: 15 minutes
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    # refresh token: 7 days
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  password-reset:
    # reset token: 24 hours (Requirement 5.2 caps this; larger values are clamped to 24h)
    token-expiry-ms: ${PASSWORD_RESET_EXPIRY_MS:86400000}
    # base URL of the frontend page that collects the new password
    url: ${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
  mail:
    from: ${MAIL_FROM:no-reply@flowforge.local}
  web:
    # Emails carry identifiers and this link only, never request data.
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  attachment:
    # Enforced while writing, so it holds even if a request understates its Content-Length.
    max-size-bytes: ${ATTACHMENT_MAX_SIZE:10485760}
    allowed-types: application/pdf,image/jpeg,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
    # Relative to the working directory (/app in the image). storage_path is relative to this root.
    storage-path: ${ATTACHMENT_STORAGE_PATH:./var/attachments}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Drives the compose healthcheck, so an unreachable SMTP host must not mark the app unhealthy.
    mail:
      enabled: false

server:
  port: 8080
