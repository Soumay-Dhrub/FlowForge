services:
  postgres:
    image: postgres:15-alpine
    container_name: flowforge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowforge-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowforge-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowforge}
      DB_USERNAME: ${POSTGRES_USER:-flowforge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      # Created only while the users table is empty. Blank password is generated and logged:
      #   docker compose logs backend | grep -A6 "first administrator"
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@flowforge.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-must-be-at-least-256-bits-long}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-2592000000}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ATTACHMENT_MAX_SIZE: ${ATTACHMENT_MAX_SIZE:-10485760}
      ATTACHMENT_STORAGE_PATH: /app/var/attachments
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Attachment bytes must outlive the container, or a rebuild orphans their metadata rows.
      - attachment_data:/app/var/attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowforge-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the /api/* rewrite at build time. Inside the container, localhost is the
        # frontend itself, so the backend must be addressed by its compose service name.
        API_PROXY_TARGET: http://backend:8080
    container_name: flowforge-frontend
    # No NEXT_PUBLIC_* here: Next.js inlines them at build time, so runtime values are never read.
    # Changing the backend address means rebuilding with a different API_PROXY_TARGET.
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - flowforge-net

  pgadmin:
    image: dpage/pgadmin4:8.6
    container_name: flowforge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@flowforge.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - flowforge-net
    profiles:
      - dev

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: flowforge-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - flowforge-net
    profiles:
      - dev

volumes:
  postgres_data:
  attachment_data:

networks:
  flowforge-net:
    driver: bridge
